# Descarga los semáforos de OpenStreetMap (Overpass) en el área de Bogotá y Soacha y los guarda en datos/semaforos_osm.json.
# Se ejecuta a mano (workflow_dispatch) o cuando cambia este archivo.
name: semaforos-osm
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/semaforos_osm.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass
        run: |
          Q='[out:json][timeout:120];(node["highway"="traffic_signals"](4.45,-74.23,4.80,-74.01);node["crossing"="traffic_signals"](4.45,-74.23,4.80,-74.01););out body;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            curl -sS --fail --max-time 180 --data-urlencode "data=$Q" "$u" -o /tmp/osm.json && break || sleep 20
          done
          python3 - <<'PY'
          import json
          j = json.load(open('/tmp/osm.json'))
          out = {"fuente": "OpenStreetMap vía Overpass API (ODbL)", "consulta": "highway=traffic_signals o crossing=traffic_signals, bbox 4.45,-74.23,4.80,-74.01",
                 "osm_base": j.get("osm3s", {}).get("timestamp_osm_base"),
                 "nodos": [[e["id"], round(e["lat"], 6), round(e["lon"], 6), e.get("tags", {}).get("highway", ""), e.get("tags", {}).get("crossing", "")] for e in j["elements"]]}
          json.dump(out, open('datos/semaforos_osm.json', 'w'), ensure_ascii=False, separators=(',', ':'))
          print(len(out["nodos"]), out["osm_base"])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos/semaforos_osm.json; git commit -m "Datos: semáforos de OpenStreetMap (Overpass)" || exit 0
          git pull --rebase origin main && git push origin main
